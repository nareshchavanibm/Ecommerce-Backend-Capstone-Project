<div class="add-product-container">

  <h2>Add Product</h2>

  <form (ngSubmit)="addProduct()" #productForm="ngForm">

    <div class="form-group">
      <label for="name">Product Name</label>

      <input id="name"
             type="text"
             name="name"
             [(ngModel)]="product.name"
             required
             minlength="2"
             maxlength="100" />
    </div>

    <div class="form-group">
      <label for="description">Description</label>

      <textarea id="description"
                name="description"
                [(ngModel)]="product.description"
                required
                minlength="5"
                maxlength="1000">
      </textarea>
    </div>

    <div class="form-group">
      <label for="price">Price</label>

      <input id="price"
             type="number"
             name="price"
             [(ngModel)]="product.price"
             min="0.01"
             required />
    </div>

    <div class="form-group">
      <label for="category">Category</label>

      <select id="category"
              name="categoryId"
              [(ngModel)]="product.categoryId"
              required>

        <option [ngValue]="0">
          Select Category
        </option>

        @for (category of categories; track category.id) {
        <option [ngValue]="category.id">
          {{ category.name }}
        </option>
        }

      </select>
    </div>

    <div class="form-group">
      <label for="initialStock">Initial Stock</label>

      <input id="initialStock"
             type="number"
             name="initialStock"
             [(ngModel)]="product.initialStock"
             min="0"
             required />
    </div>

    @if (errorMessage) {
    <p class="error-message">
      {{ errorMessage }}
    </p>
    }

    @if (successMessage) {
    <p class="success-message">
      {{ successMessage }}
    </p>
    }

    <div class="buttons">

      <button type="submit"
              [disabled]="productForm.invalid || loading">

        {{ loading ? 'Adding...' : 'Add Product' }}

      </button>

      <button type="button"
              (click)="cancel()">

        Cancel

      </button>

    </div>

  </form>

</div>
