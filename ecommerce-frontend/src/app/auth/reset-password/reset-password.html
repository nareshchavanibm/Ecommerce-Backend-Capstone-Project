<app-auth-layout headline="RESET YOUR PASSWORD" subheadline="CHOOSE A NEW ONE" message="Pick a strong password you haven't used elsewhere.">
  <h1 class="auth-form__title">Reset password</h1>
  <p class="auth-form__subtitle">Create a new password for your account.</p>

  @if (errorMessage()) {
    <app-alert class="auth-form__alert">
      {{ errorMessage() }}
      <a class="auth-link" routerLink="/forgot-password">Request a new code</a>
    </app-alert>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <app-password-input
      label="New password"
      formControlName="password"
      autocomplete="new-password"
      helperText="At least 8 characters, with a number and a symbol."
      showStrength
      required
      [errorMessages]="{ required: 'Create a password.' }"
    />

    <app-password-input
      label="Confirm new password"
      formControlName="confirmPassword"
      autocomplete="new-password"
      required
      [errorMessages]="{ required: 'Confirm your password.' }"
    />

    <button app-button type="submit" fullWidth [loading]="loading()">Reset password</button>
  </form>

  <p class="auth-form__footer">
    <a class="auth-link" routerLink="/login">Back to sign in</a>
  </p>
</app-auth-layout>
