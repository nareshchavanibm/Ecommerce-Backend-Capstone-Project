<app-auth-layout headline="FORGOT PASSWORD?" subheadline="WE'LL GET YOU BACK IN" message="Enter your email and we'll send you a 6-digit code to reset your password.">
  <h1 class="auth-form__title">Forgot password</h1>
  <p class="auth-form__subtitle">Enter the email you signed up with and we'll send a 6-digit code.</p>

  @if (errorMessage()) {
    <app-alert class="auth-form__alert">{{ errorMessage() }}</app-alert>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <app-text-input
      label="Email"
      type="email"
      icon="mail"
      formControlName="email"
      autocomplete="email"
      placeholder="you@example.com"
      required
      [errorMessages]="{ required: 'Enter your email address.' }"
    />

    <button app-button type="submit" fullWidth [loading]="loading()">Send code</button>
  </form>

  <p class="auth-form__footer">
    Remembered it?
    <a class="auth-link" routerLink="/login">Back to sign in</a>
  </p>
</app-auth-layout>
