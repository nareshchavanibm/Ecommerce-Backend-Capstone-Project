<div class="login-container">

  <h2>Login</h2>

  <form (ngSubmit)="login()" #loginForm="ngForm">

    <div>
      <label>Email</label>

      <input type="email"
             [(ngModel)]="email"
             name="email"
             required />
    </div>

    <div>
      <label>Password</label>

      <input type="password"
             [(ngModel)]="password"
             name="password"
             required />
    </div>

    <button type="submit"
            [disabled]="loginForm.invalid">

      Login

    </button>

  </form>


  @if (errorMessage) {

  <p class="error-message">
    {{ errorMessage }}
  </p>

  }


  <div class="signup-link">

    <p>
      Don't have an account?
    </p>

    <a routerLink="/signup">
      Sign Up
    </a>

  </div>

</div>
