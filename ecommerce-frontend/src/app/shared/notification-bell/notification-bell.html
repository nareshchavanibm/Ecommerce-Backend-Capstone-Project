<button type="button"
        class="bell"
        [attr.aria-label]="notifications.unread() > 0 ? 'Notifications, ' + notifications.unread() + ' unread' : 'Notifications'"
        aria-haspopup="true"
        [attr.aria-expanded]="open()"
        aria-controls="notification-panel"
        (click)="toggle()">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
    <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 21h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </svg>

  @if (notifications.unread() > 0) {
    <span class="bell__badge" aria-hidden="true">{{ notifications.unread() > 9 ? '9+' : notifications.unread() }}</span>
  }
</button>

@if (open()) {
  <div id="notification-panel" class="panel">

    <div class="panel__head">
      <h2 class="panel__title">Notifications</h2>

      @if (notifications.items().length > 0) {
        <div class="panel__tools">
          @if (notifications.unread() > 0) {
            <button type="button" class="link" (click)="notifications.markAllRead()">Mark all read</button>
          }
          <button type="button" class="link" (click)="notifications.clear()">Clear</button>
        </div>
      }
    </div>

    @if (notifications.items().length === 0) {
      <p class="panel__empty">You are all caught up.</p>
    } @else {
      <ul class="list">
        @for (item of notifications.items(); track item.id) {
          <li>
            <button type="button" class="item" [class.item--unread]="!item.read" (click)="openItem(item)">
              <span class="item__dot" aria-hidden="true"></span>
              <span class="item__text">
                <span class="item__title">{{ item.title }}</span>
                <span class="item__message">{{ item.message }}</span>
                <span class="item__time">{{ item.time | date: 'MMM d, h:mm a' }}</span>
              </span>
            </button>
          </li>
        }
      </ul>
    }

  </div>
}
