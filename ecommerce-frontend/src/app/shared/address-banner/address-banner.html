@if (visible()) {
  <div class="banner" role="status">
    <div class="banner__inner container">

      <svg class="banner__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <circle cx="12" cy="10.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8" />
      </svg>

      <p class="banner__text">
        You have not added a delivery address yet. Add one so we know where to send your orders.
      </p>

      <a class="banner__action" routerLink="/profile" [queryParams]="{ addAddress: 1 }">Add address</a>

      <button type="button" class="banner__close" aria-label="Dismiss message" (click)="dismiss()">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.75" />
        </svg>
      </button>

    </div>
  </div>
}
