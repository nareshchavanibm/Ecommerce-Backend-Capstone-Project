<div
  class="field"
  [class.field--error]="errorText"
  [class.field--disabled]="disabled()"
>
  <label class="field__label" [for]="id">{{ label() }}</label>

  <div class="field__control">
    <svg class="field__lead" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <rect x="3" y="7" width="10" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>

    <input
      class="field__input field__input--icon field__input--toggle"
      [id]="id"
      [type]="visible() ? 'text' : 'password'"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="errorText ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    <button
      type="button"
      class="field__toggle"
      [disabled]="disabled()"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible()"
      (click)="toggle()"
    >
      {{ visible() ? 'HIDE' : 'SHOW' }}
    </button>
  </div>

  @if (showStrength()) {
    <div class="strength" aria-live="polite">
      <div class="strength__bar" aria-hidden="true" [attr.data-level]="strength()">
        @for (segment of segments; track segment) {
          <span class="strength__segment" [class.strength__segment--filled]="strength() >= segment"></span>
        }
      </div>
      @if (strengthLabel()) {
        <p class="strength__label">Password strength: {{ strengthLabel() }}</p>
      }
    </div>
  }

  <div aria-live="polite">
    @if (errorText) {
      <p class="field__message field__message--error" [id]="id + '-error'">{{ errorText }}</p>
    } @else if (helperText()) {
      <p class="field__message" [id]="id + '-helper'">{{ helperText() }}</p>
    }
  </div>
</div>
