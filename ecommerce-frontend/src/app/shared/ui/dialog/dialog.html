<dialog
  #dialog
  class="dialog"
  [class.dialog--sheet]="sheet()"
  [attr.aria-labelledby]="id + '-title'"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
>
  <div class="dialog__panel">
    <header class="dialog__header">
      <h2 class="dialog__title" [id]="id + '-title'">{{ heading() }}</h2>

      <button type="button" class="dialog__close" aria-label="Close dialog" (click)="open.set(false)">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </header>

    <div class="dialog__body"><ng-content /></div>

    <footer class="dialog__footer"><ng-content select="[dialog-footer]" /></footer>
  </div>
</dialog>
