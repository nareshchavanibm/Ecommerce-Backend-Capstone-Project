@if (maps.enabled) {
  <div class="picker">

    <button app-button type="button" variant="outline" class="picker__locate" [loading]="locating()" (click)="useCurrentLocation()">
      <span class="picker__content">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
        Use my current location
      </span>
    </button>

    <div class="picker__search">
      <p class="picker__label">Or search for your address</p>
      <div #searchHost class="picker__host"></div>
    </div>

    @if (message()) {
      <p class="picker__message" role="alert">{{ message() }}</p>
    }

  </div>
}
