<span class="stars" aria-hidden="true">
  <span class="stars__row stars__row--empty">
    @for (star of stars; track star) {
      <svg viewBox="0 0 24 24" focusable="false"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" /></svg>
    }
  </span>
  <span class="stars__row stars__row--fill" [style.width.%]="percent()">
    @for (star of stars; track star) {
      <svg viewBox="0 0 24 24" focusable="false"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" /></svg>
    }
  </span>
</span>

@if (showValue()) {
  <span class="value" aria-hidden="true">{{ value() | number: '1.1-1' }}</span>
}

@if (showLabel()) {
  <span class="label" aria-hidden="true">{{ label() }}</span>
}

@if (count() !== null) {
  <span class="count" aria-hidden="true">({{ count() }})</span>
}
