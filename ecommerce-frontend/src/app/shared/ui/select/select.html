<div class="field" [class.field--error]="errorText" [class.field--disabled]="disabled()">
  <label class="field__label" [for]="id">{{ label() }}</label>

  <div class="field__control">
    <select
      class="field__input"
      [id]="id"
      [disabled]="disabled()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="errorText ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      (change)="onSelect($event)"
      (blur)="onBlur()"
    >
      @if (placeholder()) {
        <option value="" [selected]="value() === ''" disabled>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
      }
    </select>

    <svg class="field__chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>
  </div>

  <div aria-live="polite">
    @if (errorText) {
      <p class="field__message field__message--error" [id]="id + '-error'">{{ errorText }}</p>
    } @else if (helperText()) {
      <p class="field__message" [id]="id + '-helper'">{{ helperText() }}</p>
    }
  </div>
</div>
