@switch (variant()) {
  @case ('success') {
    <svg class="alert__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M5 8.25l2.25 2.25L11 6" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>
  }
  @case ('info') {
    <svg class="alert__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M8 7.25v4.25M8 4.5v.75" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>
  }
  @default {
    <svg class="alert__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M8 4.5v4.5M8 10.75v.75" fill="none" stroke="currentColor" stroke-width="1.5" />
    </svg>
  }
}

<div class="alert__body"><ng-content /></div>
