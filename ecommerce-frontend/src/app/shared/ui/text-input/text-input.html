<div
  class="field"
  [class.field--error]="errorText"
  [class.field--success]="success() && !errorText"
  [class.field--disabled]="disabled()"
>
  <label class="field__label" [for]="id">
    {{ label() }}
    @if (!required()) {
      <span class="field__optional">(optional)</span>
    }
  </label>

  <div class="field__control">
    @if (icon()) {
      <svg class="field__lead" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        @switch (icon()) {
          @case ('user') {
            <circle cx="8" cy="5.5" r="2.75" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M2.5 14c.5-2.75 2.75-4.25 5.5-4.25s5 1.5 5.5 4.25" fill="none" stroke="currentColor" stroke-width="1.5" />
          }
          @case ('mail') {
            <rect x="1.75" y="3.5" width="12.5" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M2 4.5l6 4.5 6-4.5" fill="none" stroke="currentColor" stroke-width="1.5" />
          }
          @case ('lock') {
            <rect x="3" y="7" width="10" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.5" />
          }
        }
      </svg>
    }

    <input
      class="field__input"
      [class.field__input--icon]="icon()"
      [id]="id"
      [type]="type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxlength()"
      [attr.inputmode]="numericOnly() ? 'numeric' : null"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="errorText ? 'true' : null"
      [attr.aria-describedby]="describedBy"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    @if (errorText) {
      <svg class="field__icon field__icon--error" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M8 4.5v4.5M8 10.75v.75" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
    } @else if (success()) {
      <svg class="field__icon field__icon--success" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M5 8.25l2.25 2.25L11 6" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
    }
  </div>

  <div aria-live="polite">
    @if (errorText) {
      <p class="field__message field__message--error" [id]="id + '-error'">{{ errorText }}</p>
    } @else if (helperText()) {
      <p class="field__message" [id]="id + '-helper'">{{ helperText() }}</p>
    }
  </div>
</div>
