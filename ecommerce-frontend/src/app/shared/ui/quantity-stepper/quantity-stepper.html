<div class="qty" role="group" [attr.aria-label]="label()">
  <button type="button" class="qty__btn" aria-label="Decrease quantity" [disabled]="!canDecrease()" (click)="step(-1)">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
      <path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <output class="qty__value" aria-live="polite">{{ value() }}</output>

  <button type="button" class="qty__btn" aria-label="Increase quantity" [disabled]="!canIncrease()" (click)="step(1)">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
      <path d="M3 8h10M8 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
</div>
