<div
  class="otp"
  [class.otp--error]="errorText"
  [class.otp--success]="success() && !errorText"
  [class.otp--disabled]="disabled()"
>
  <span class="otp__label" [id]="id + '-label'">{{ label() }}</span>

  <div class="otp__boxes" role="group" [attr.aria-labelledby]="id + '-label'" (focusout)="onFocusOut($event)">
    @for (i of indexes; track i) {
      <input
        #box
        class="otp__box"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        [value]="digits()[i]"
        [disabled]="disabled()"
        [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
        [attr.aria-label]="'Digit ' + (i + 1) + ' of ' + indexes.length"
        [attr.aria-invalid]="errorText ? 'true' : null"
        [attr.aria-describedby]="describedBy"
        (input)="onInput(i, $event)"
        (keydown)="onKeydown(i, $event)"
        (paste)="onPaste(i, $event)"
        (focus)="onFocus($event)"
      />
    }
  </div>

  <div aria-live="polite">
    @if (errorText) {
      <p class="otp__message otp__message--error" [id]="id + '-error'">{{ errorText }}</p>
    } @else if (helperText()) {
      <p class="otp__message" [id]="id + '-helper'">{{ helperText() }}</p>
    }
  </div>
</div>
