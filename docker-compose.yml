
services:

  # =========================
  # SQL SERVER
  # =========================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - ecommerce-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - ecommerce-network

  # =========================
  # REDIS CACHE
  # =========================
  redis:
    image: redis:7
    container_name: ecommerce-redis
    restart: unless-stopped

    networks:
      - ecommerce-network

  # =========================
  # USER SERVICE
  # =========================
  userservice:
    build:
      context: .
      dockerfile: Services/UserService/Dockerfile

    image: localhost/ecommerce-userservice:latest
    container_name: ecommerce-userservice
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ECommerceUserDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5094:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - ecommerce-network

  # =========================
  # PRODUCT SERVICE
  # =========================
  productservice:
    build:
      context: .
      dockerfile: Services/ProductService/Dockerfile

    image: localhost/ecommerce-productservice:latest
    container_name: ecommerce-productservice
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ECommerceProductDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      ConnectionStrings__Redis: "redis:6379"

      Services__OrderServiceUrl: "http://orderservice:8080"

      Internal__ApiKey: "${INTERNAL_API_KEY}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5095:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - ecommerce-network

  # =========================
  # ORDER SERVICE
  # =========================
  orderservice:
    build:
      context: .
      dockerfile: Services/OrderService/Dockerfile

    image: localhost/ecommerce-orderservice:latest
    container_name: ecommerce-orderservice
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ECommerceOrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      Services__ProductServiceUrl: "http://productservice:8080"
      Internal__ApiKey: "${INTERNAL_API_KEY}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5096:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      productservice:
        condition: service_started

    networks:
      - ecommerce-network

  # =========================
  # PAYMENT SERVICE
  # =========================
  paymentservice:
    build:
      context: .
      dockerfile: Services/PaymentService/Dockerfile

    image: localhost/ecommerce-paymentservice:latest
    container_name: ecommerce-paymentservice
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ECommercePaymentDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      Services__OrderServiceUrl: "http://orderservice:8080"
      Internal__ApiKey: "${INTERNAL_API_KEY}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5097:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      orderservice:
        condition: service_started

    networks:
      - ecommerce-network

  # =========================
  # CHAT SERVICE
  # =========================
  chatservice:
    build:
      context: .
      dockerfile: Services/ChatService/Dockerfile

    image: localhost/ecommerce-chatservice:latest
    container_name: ecommerce-chatservice
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      Services__ProductServiceUrl: "http://productservice:8080"
      Services__OrderServiceUrl: "http://orderservice:8080"
      Services__ReviewServiceUrl: "http://reviewservice:8080"

      Foundry__Endpoint: "${FOUNDRY_ENDPOINT:-}"
      Foundry__ChatDeployment: "${FOUNDRY_CHAT_DEPLOYMENT:-gpt-5.4-mini}"
      Foundry__EmbeddingDeployment: "${FOUNDRY_EMBEDDING_DEPLOYMENT:-}"
      Foundry__ApiKey: "${FOUNDRY_API_KEY:-}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5098:8080"

    depends_on:
      productservice:
        condition: service_started
      orderservice:
        condition: service_started

    networks:
      - ecommerce-network

  # =========================
  # REVIEW SERVICE
  # =========================
  reviewservice:
    build:
      context: .
      dockerfile: Services/ReviewService/Dockerfile

    image: localhost/ecommerce-reviewservice:latest
    container_name: ecommerce-reviewservice
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ECommerceReviewDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

      Services__OrderServiceUrl: "http://orderservice:8080"
      Internal__ApiKey: "${INTERNAL_API_KEY}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5099:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      orderservice:
        condition: service_started

    networks:
      - ecommerce-network

  # =========================
  # API GATEWAY
  # =========================
  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile

    image: localhost/ecommerce-apigateway:latest
    container_name: ecommerce-apigateway
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"

      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/ecommerce-gateway.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${GATEWAY_CERT_PASSWORD}"

      Cors__AllowedOrigins__1: "http://172.26.66.30:4000"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

    ports:
      - "5100:8080"
      - "5101:8443"

    volumes:
      - type: bind
        source: "C:/Users/NareshChavan/.aspnet/https"
        target: "/https"
        read_only: true

    depends_on:
      userservice:
        condition: service_started
      productservice:
        condition: service_started
      orderservice:
        condition: service_started
      paymentservice:
        condition: service_started
      chatservice:
        condition: service_started
      reviewservice:
        condition: service_started

    networks:
      - ecommerce-network

# =========================
# VOLUMES
# =========================
volumes:
  ecommerce-sqlserver-data:
    external: true

# =========================
# NETWORK
# =========================
networks:
  ecommerce-network:
    external: true
