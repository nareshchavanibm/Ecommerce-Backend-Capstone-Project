apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
        - name: userservice
          image: ghcr.io/REPO_OWNER/ecommerce-userservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: MSSQL_SA_PASSWORD }
            - name: ConnectionStrings__DefaultConnection
              value: Server=sqlserver,1433;Database=ECommerceUserDb;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=True;
            - name: Jwt__Key
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: JWT_KEY }
            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: JWT_ISSUER }
            - name: Jwt__Audience
              valueFrom:
                secretKeyRef: { name: ecommerce-secrets, key: JWT_AUDIENCE }
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  selector:
    app: userservice
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
