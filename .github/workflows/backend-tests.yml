name: Backend tests

on:
  push:
    branches:
      - main
    paths:
      - 'Services/**'
      - 'ApiGateway/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'Services/**'
      - 'ApiGateway/**'
      - '.github/workflows/backend-tests.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test Services/Services.Tests --configuration Release

      - name: Integration tests
        run: dotnet test Services/Services.IntegrationTests --configuration Release
