name: ApiGateway CI

on:
  push:
    branches:
      - main
    paths:
      - 'ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'
  pull_request:
    paths:
      - 'ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ApiGateway/ApiGateway.csproj

      - name: Build
        run: dotnet build ApiGateway/ApiGateway.csproj --configuration Release --no-restore

      - name: Build Docker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ApiGateway/Dockerfile
          push: false
